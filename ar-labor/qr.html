<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/ar-labor/">
<title>AR Labor – QR-kódok nyomtatáshoz | BME Építőmérnöki Kar</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'BarlowC';font-weight:800;src:url(../fonts/barlow-condensed-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'BarlowC';font-weight:800;src:url(../fonts/barlow-condensed-latin-ext-800-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F}
@font-face{font-family:'Inter';font-weight:400;src:url(../fonts/inter-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Inter';font-weight:400;src:url(../fonts/inter-latin-ext-400-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+1E00-1E9F}
@font-face{font-family:'Inter';font-weight:600;src:url(../fonts/inter-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'Inter';font-weight:600;src:url(../fonts/inter-latin-ext-600-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+1E00-1E9F}
@page{size:A4; margin:0}
*{box-sizing:border-box}
html,body{margin:0; background:#d9dde1; font-family:'Inter',system-ui,sans-serif; color:#0b0e12; -webkit-print-color-adjust:exact; print-color-adjust:exact}
.bar{position:sticky; top:0; z-index:5; display:flex; gap:12px; align-items:center; justify-content:center; padding:12px; background:#0b0e12; color:#eef1ea; font:600 15px/1.3 'Inter'}
.bar button{height:42px; padding:0 20px; border-radius:999px; border:0; background:#c6f432; color:#0b0e12; font:800 18px/1 'BarlowC'; letter-spacing:.08em; text-transform:uppercase; cursor:pointer}
.page{width:210mm; height:297mm; margin:10mm auto; background:#fff; padding:12mm; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8mm; page-break-after:always; break-after:page; overflow:hidden}
.page:last-child{page-break-after:auto; break-after:auto}
.card{border:1.2mm solid var(--c); border-radius:6mm; padding:6mm; display:flex; flex-direction:column; align-items:center; text-align:center; position:relative; overflow:hidden}
.card .n{position:absolute; left:5mm; top:4mm; font:800 30pt/1 'BarlowC'; color:var(--c)}
.card small{display:block; font:800 10pt/1.2 'BarlowC'; letter-spacing:.12em; text-transform:uppercase; color:var(--c); margin:1mm 0 0 14mm; align-self:stretch; text-align:left}
.card h2{font:800 19pt/1 'BarlowC'; text-transform:uppercase; margin:2mm 0 3mm; min-height:2em; display:flex; align-items:center}
.card img{width:100%; height:36mm; object-fit:cover; border-radius:3mm; background:#e8eef2}
.card .q{width:50mm; height:50mm; margin:5mm 0 4mm}
.card .q svg{width:100%; height:100%; display:block}
.card b{font:800 15pt/1 'BarlowC'; letter-spacing:.06em; text-transform:uppercase}
.card span{font:400 8.5pt/1.3 'Inter'; color:#4a525b; margin-top:1.5mm}
.cover{grid-template-columns:1fr; grid-template-rows:auto 1fr auto; text-align:center; padding:18mm}
.cover h1{font:800 54pt/.92 'BarlowC'; text-transform:uppercase; margin:0}
.cover h1 em{font-style:normal; color:#7aa00a}
.cover p{font:600 15pt/1.4 'Inter'; margin:6mm 0 0}
.cover .q{width:120mm; height:120mm; margin:0 auto; align-self:center}
.cover .q svg{width:100%; height:100%}
.cover ol{text-align:left; font:600 13pt/1.45 'Inter'; margin:0 auto; max-width:150mm; padding-left:7mm}
.cover .u{font:800 18pt/1 'BarlowC'; letter-spacing:.04em; margin-top:5mm}
@media print{ html,body{background:#fff} .bar{display:none} .page{margin:0} }
</style>
</head>
<body>
<div class="bar">Nyomtatás: A4, álló, margó nélkül (a böngésző nyomtatási ablakában „Nincs” margó) <button type="button" onclick="print()">Nyomtatás</button></div>
<div id="pages"></div>
<script src="vendor/qrcode.js"></script>
<script>
const D = {"site": "https://bme-epitomernok.vercel.app", "M": [{"id": "mol-campus", "name": "MOL Campus", "hook": "143 méter a Duna-parton – és a titka a föld alatt van.", "img": "mol-campus", "sp": "Geotechnika", "c": "#b8e04a"}, {"id": "ferdekabeles-hid", "name": "Megyeri híd", "hook": "Két 100 méteres „A” pilon és 88 kábel tartja az M0 autóút Duna-hídját.", "img": "ferdekabeles-hid", "sp": "Tartószerkezetek", "c": "#ff8a3d"}, {"id": "metro-pajzs", "name": "M4-metró a Duna alatt – Szent Gellért tér", "hook": "31 méterrel a felszín alatt, közvetlenül a Duna mellett: a vonal legmélyebb állomása.", "img": "metro-pajzs", "sp": "Közlekedés", "c": "#ffd23f"}, {"id": "nyomtatott-haz", "name": "A CH épület – betonból nyomtatva", "hook": "A Műegyetem legrégebbi épülete rétegről rétegre – makettként, betonnyomtatóval.", "img": "nyomtatott-haz", "sp": "Építéstechnológia", "c": "#b48cff"}, {"id": "hajozsilip", "name": "Kvassay-zsilip", "hook": "Budapesten, a Ráckevei (Soroksári)-Duna torkolatánál: itt lép át a hajó a két vízszint között.", "img": "hajozsilip", "sp": "Vízmérnöki", "c": "#4f8dff"}, {"id": "dron-pontfelho", "name": "A K épület pontfelhőben", "hook": "A Műegyetem főépülete: félig valóság, félig lézerrel mért pontfelhő.", "img": "dron-pontfelho", "sp": "Geoinformatika", "c": "#3fd0e8"}, {"id": "cfa", "name": "CFA-cölöp fúrás közben", "hook": "Becsavarja magát a talajba – béléscső és zagy nélkül.", "img": "cfa-makett", "sp": "Geotechnika", "c": "#b8e04a"}, {"id": "foldrenges-razoasztal", "name": "Földrengés a laborban", "hook": "Két egyforma épületmodell egy rázóasztalon – az egyik gumisarukon áll.", "img": "foldrenges-razoasztal", "sp": "Tartószerkezetek", "c": "#ff8a3d"}, {"id": "birtokrendezes", "name": "Birtokrendezés – Tihany, Belső-tó", "hook": "Keskeny, szétszórt csíkokból összefüggő táblák – ez a földrendező mérnök munkája.", "img": "birtokrendezes", "sp": "Földrendező", "c": "#5ccf7a"}, {"id": "autopalya-csomopont", "name": "M1–M7 elágazás, Budaörs", "hook": "Itt válik szét a Bécs és a Balaton felé vezető autópálya.", "img": "autopalya-csomopont", "sp": "Közlekedés", "c": "#ffd23f"}, {"id": "gat-vizeromu", "name": "Kiskörei vízlépcső", "hook": "Itt születik a Tisza-tó: duzzasztómű, vízerőmű és hajózsilip egyben.", "img": "gat-vizeromu", "sp": "Vízmérnöki", "c": "#4f8dff"}, {"id": "felhokarcolo-tmd", "name": "Pécsi tévétorony", "hook": "197 méter vasbeton a Misina tetején – a csúcsa viharban akár fél métert is kileng.", "img": "felhokarcolo-tmd", "sp": "Tartószerkezetek", "c": "#ff8a3d"}, {"id": "bim-epitkezes", "name": "Néprajzi Múzeum – BIM-mel építve", "hook": "Két íves szárny, a tetejükön kert – a digitális modell szerint, ütemről ütemre.", "img": "bim-epitkezes", "sp": "Építéstechnológia", "c": "#b48cff"}, {"id": "mobilgat", "name": "Szentendrei mobilgát", "hook": "Árvízkor alumíniumfal nő a Duna korzón – az ország első mobilgátja.", "img": "mobilgat", "sp": "Vízmérnöki", "c": "#4f8dff"}, {"id": "nagysebessegu-vasut", "name": "Nagyrákosi völgyhíd", "hook": "Az ország leghosszabb vasúti hídja az Őrségben.", "img": "nagysebessegu-vasut", "sp": "Közlekedés", "c": "#ffd23f"}, {"id": "pisa", "name": "A pisai ferde torony", "hook": "800 éve dől – geotechnikusok állították meg.", "img": "pisa-makett", "sp": "Geotechnika", "c": "#b8e04a"}]};
const qr = (t, ec = 'M') => { const q = qrcode(0, ec); q.addData(t); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); };
const app = D.site + '/ar-labor';
let h = `<section class="page cover"><div><h1>AR Labor<br><em>Nézd meg térben!</em></h1><p>16 mozgó 3D-modell a BME Építőmérnöki Kar specializációiról – a telefonodon, előtted az asztalon vagy a padlón.</p></div>
  <div class="q">${qr(app, 'Q')}</div>
  <div><ol><li>Olvasd be a kódot a telefonod kamerájával.</li><li>Válassz modellt, és koppints a „Nézd meg térben” gombra.</li><li>Nézz a padlóra vagy egy asztalra: ahol a zöld keret megjelenik, koppints, és oda kerül a modell. Két ujjal nagyíthatod, és körbejárhatod.</li></ol><div class="u">${app.replace('https://', '')}</div></div></section>`;
for (let i = 0; i < D.M.length; i += 4) {
  h += '<section class="page">' + D.M.slice(i, i + 4).map((m, k) => `<div class="card" style="--c:${m.c}"><div class="n">${String(i + k + 1).padStart(2, '0')}</div><small>${m.sp}</small><h2>${m.name}</h2>
    <img src="img/${m.img}.jpg" alt=""><div class="q">${qr(app + '?m=' + m.id + '&ar=1')}</div><b>Olvasd be, és nézd meg térben!</b></div>`).join('') + '</section>';
}
document.getElementById('pages').innerHTML = h;
</script>
</body>
</html>
